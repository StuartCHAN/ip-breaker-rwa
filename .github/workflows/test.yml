name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js for documentation checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Mermaid diagrams by rendering SVG
        run: |
          npm install --no-save --package-lock=false @mermaid-js/mermaid-cli@11.12.0
          node scripts/validate-mermaid.mjs

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Simulate Full Protocol Deployment
        run: |
          export PRIVATE_KEY="$(cast wallet private-key \
            --mnemonic 'test test test test test test test test test test test junk' \
            --mnemonic-index 0)"
          forge script script/DeployFullProtocol.s.sol:DeployFullProtocol -vvv

      - name: Run All Forge Tests
        run: forge test -vvv

      - name: Run Security Tests
        run: forge test --match-path test/LicenseEscrow.Security.t.sol -vvv

      - name: Run State Machine Tests
        run: forge test --match-path test/LicenseEscrow.StateMachine.t.sol -vvv

      - name: Run Invariant Tests
        run: forge test --match-path test/LicenseEscrow.Invariant.t.sol -vvv
