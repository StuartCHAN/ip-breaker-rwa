name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          submodules: recursive

      - name: Set up Node.js for documentation checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply known Mermaid syntax fixes
        if: github.event_name == 'push' && github.ref_name == 'docs/research-showcase'
        run: node scripts/apply-mermaid-fixes.mjs

      - name: Commit Mermaid syntax fixes
        if: github.event_name == 'push' && github.ref_name == 'docs/research-showcase'
        run: |
          if git diff --quiet -- docs/Phase3.1-Final-Architecture-Review.md docs/Phase3.2-OfferingEscrow-Design.md; then
            echo "No Mermaid syntax changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Phase3.1-Final-Architecture-Review.md docs/Phase3.2-OfferingEscrow-Design.md
          git commit -m "docs: fix Mermaid sequence syntax"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Validate Mermaid diagrams by rendering SVG
        run: |
          npm install --no-save --package-lock=false @mermaid-js/mermaid-cli@11.12.0
          node scripts/validate-mermaid.mjs

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Simulate Full Protocol Deployment
        env:
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: forge script script/DeployFullProtocol.s.sol:DeployFullProtocol -vvv

      - name: Run All Forge Tests
        run: forge test -vvv

      - name: Run Security Tests
        run: forge test --match-path test/LicenseEscrow.Security.t.sol -vvv

      - name: Run State Machine Tests
        run: forge test --match-path test/LicenseEscrow.StateMachine.t.sol -vvv

      - name: Run Invariant Tests
        run: forge test --match-path test/LicenseEscrow.Invariant.t.sol -vvv
